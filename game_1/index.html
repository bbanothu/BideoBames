<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Ichigo vs Vegeta</title>
<style>
  html,body { margin:0; height:100%; background:#111; display:flex; align-items:center; justify-content:center; font-family:sans-serif; }
  #ui { color:#ccc; text-align:center; }
  #stage { position:relative; width:800px; height:450px; }
  canvas { display:block; background:#6ec6ff; border:2px solid #333; image-rendering:pixelated; }

  #overlay {
    position:absolute; inset:0; background:rgba(10,10,15,0.92);
    border:2px solid #333; color:#eee; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:18px; text-align:center;
  }
  #overlay h1 { margin:0; font-size:2.2em; }
  #overlay h2 { margin:0; color:#aaa; font-weight:normal; }
  .btn-row { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
  button.big {
    font-size:1.1em; padding:12px 28px; cursor:pointer; border:none; border-radius:6px;
    background:#e33; color:#fff; font-weight:bold;
  }
  button.big:hover { background:#ff5544; }
  button.big:disabled { background:#555; cursor:not-allowed; }

  .select-columns { display:flex; gap:40px; }
  .select-col h3 { margin:4px 0; }
  .char-grid { display:flex; gap:12px; }
  .char-btn {
    width:110px; cursor:pointer; border:3px solid #555; border-radius:8px;
    background:#222; padding:6px; color:#eee;
  }
  .char-btn img { width:96px; height:78px; object-fit:contain; image-rendering:pixelated; display:block; margin:0 auto; }
  .char-btn.selected { border-color:#3af23a; background:#243b24; }
  .char-btn:hover { border-color:#e33; }
</style>
</head>
<body>
<div id="ui">
  <div id="stage">
    <canvas id="game" width="800" height="450"></canvas>
    <div id="overlay"></div>
  </div>
  <p>P1: WASD move, W jump, Q/E attack &nbsp;|&nbsp; P2: Arrows move, Up jump, , / . attack</p>
</div>
<script src="game.js"></script>
</body>
</html>
